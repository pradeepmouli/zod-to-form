name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Registry freshness
        run: pnpm registry:check

      - name: Type check
        run: pnpm run type-check

      - name: Type-focused unit tests
        run: |
          pnpm --filter @zod-to-form/core run test -- tests/component-config-types.test.ts
          pnpm --filter @zod-to-form/cli run test -- tests/component-config-types.test.ts

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check
        continue-on-error: true

      - name: Test
        run: pnpm run test

      - name: Test Coverage
        run: pnpm run test:coverage
        if: matrix.node-version == '22.x'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: matrix.node-version == '22.x'
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Security Audit
        run: pnpm audit -r --audit-level moderate
        continue-on-error: true
