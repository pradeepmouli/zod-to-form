name: Deploy shadcn-proxy Worker

on:
  push:
    branches: [master]
    paths:
      - "apps/shadcn-proxy/**"
      - ".github/workflows/deploy-shadcn-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadcn-proxy-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Worker
        run: pnpm --filter @zod-to-form/shadcn-proxy run type-check

      - name: Run Worker tests
        run: pnpm --filter @zod-to-form/shadcn-proxy test

      - name: Deploy to Cloudflare Workers
        run: pnpm --filter @zod-to-form/shadcn-proxy run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
