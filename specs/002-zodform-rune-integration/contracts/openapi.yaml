openapi: 3.1.0
info:
  title: zod-to-form Feature Contracts
  version: 0.1.0
  description: |
    Logical API contracts for the Rune Integration Additions feature.
    These represent package-level interaction contracts (core/react/cli),
    modeled as HTTP resources for contract validation and test planning.
servers:
  - url: https://contracts.local
paths:
  /core/walk-schema:
    post:
      summary: Walk schema into FormField definitions
      operationId: walkSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalkSchemaRequest'
      responses:
        '200':
          description: Walk output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkSchemaResponse'
  /react/use-zod-form:
    post:
      summary: Resolve runtime lifecycle behavior for a form session
      operationId: useZodFormLifecycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UseZodFormRequest'
      responses:
        '200':
          description: Lifecycle event contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UseZodFormResponse'
  /cli/generate:
    post:
      summary: Generate form source output from schema and options
      operationId: generateForm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CliGenerateRequest'
      responses:
        '200':
          description: Generation success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliGenerateResponse'
        '400':
          description: Configuration or validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    WalkSchemaRequest:
      type: object
      required: [schemaRef]
      properties:
        schemaRef:
          type: string
        processors:
          type: object
          additionalProperties:
            type: string
          description: Processor mapping by schema type key.
        formMetadata:
          type: object
          additionalProperties: true
    FormField:
      type: object
      required: [name, component, props]
      properties:
        name:
          type: string
        component:
          type: string
          description: Token or component identifier.
        props:
          type: object
          additionalProperties: true
        constraints:
          type: object
          additionalProperties: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
    WalkSchemaResponse:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
    UseZodFormRequest:
      type: object
      required: [schemaRef]
      properties:
        schemaRef:
          type: string
        defaultValues:
          type: object
          additionalProperties: true
        mode:
          type: string
          enum: [onSubmit, onChange, onBlur]
        withOnSubmit:
          type: boolean
        withOnValueChange:
          type: boolean
        componentConfig:
          $ref: '#/components/schemas/ComponentConfig'
    UseZodFormResponse:
      type: object
      required: [emitsOnMount, emitsWhenInvalid, supportsSubmit, supportsValueChange]
      properties:
        emitsOnMount:
          type: boolean
          const: false
        emitsWhenInvalid:
          type: boolean
          const: false
        supportsSubmit:
          type: boolean
        supportsValueChange:
          type: boolean
    ComponentEntry:
      type: object
      required: [component]
      properties:
        component:
          type: string
        render:
          type: string
          description: Symbolic function reference in config models.
    ComponentConfig:
      type: object
      required: [components, fieldTypes]
      properties:
        components:
          type: string
        fieldTypes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentEntry'
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              fieldType:
                type: string
              props:
                type: object
                additionalProperties: true
    CliGenerateRequest:
      type: object
      required: [schemaPath, outDir]
      properties:
        schemaPath:
          type: string
        outDir:
          type: string
        mode:
          type: string
          enum: [submit, auto-save]
          default: submit
        componentConfig:
          $ref: '#/components/schemas/ComponentConfig'
    CliGenerateResponse:
      type: object
      required: [generatedFiles, mode]
      properties:
        generatedFiles:
          type: array
          items:
            type: string
        mode:
          type: string
          enum: [submit, auto-save]
        usedComponentConfig:
          type: boolean
        fallbackToDefaultInputs:
          type: boolean
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_COMPONENT_CONFIG
            - INVALID_COMPONENT_ENTRY
            - INVALID_RUNTIME_COMPONENT
        message:
          type: string
        details:
          type: object
          additionalProperties: true
