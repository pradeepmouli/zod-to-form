openapi: 3.1.0
info:
  title: zod-to-form CLI Init Contracts
  version: 0.1.0
  description: |
    Logical API contracts for the CLI init enhancement.
    These contracts model package interactions as HTTP resources
    for planning, validation, and test traceability.
servers:
  - url: https://contracts.local
paths:
  /cli/init:
    post:
      summary: Initialize component-config file for a project
      operationId: initComponentConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitRequest'
      responses:
        '200':
          description: Init completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitResponse'
        '409':
          description: Target config already exists and force not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cli/load-config:
    post:
      summary: Resolve project config using new and legacy file names
      operationId: resolveConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConfigRequest'
      responses:
        '200':
          description: Config resolution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveConfigResponse'
  /core/component-config/validate:
    post:
      summary: Validate shared component-config contract shape
      operationId: validateComponentConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComponentConfigContract'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
components:
  schemas:
    InitRequest:
      type: object
      required: [cwd]
      properties:
        cwd:
          type: string
        outFile:
          type: string
          default: component-config.ts
        force:
          type: boolean
          default: false
        dryRun:
          type: boolean
          default: false
        verbose:
          type: boolean
          default: false
    ShadcnSnapshot:
      type: object
      required: [exists, aliases]
      properties:
        exists:
          type: boolean
        componentsPath:
          type: string
          nullable: true
        aliases:
          type: object
          additionalProperties:
            type: string
        style:
          type: string
          nullable: true
    ComponentEntry:
      type: object
      required: [component]
      properties:
        component:
          type: string
        render:
          type: string
          description: Symbolic function reference for logical contract modeling.
    ComponentConfigContract:
      type: object
      required: [components, fieldTypes]
      properties:
        components:
          type: string
        fieldTypes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentEntry'
        fields:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
    InitSummary:
      type: object
      required: [status, stepsCompleted, fileWritten]
      properties:
        status:
          type: string
          enum: [success, warning, error]
        stepsCompleted:
          type: integer
          minimum: 0
        fileWritten:
          type: boolean
        outputPath:
          type: string
        usedFallbacks:
          type: array
          items:
            type: string
        verboseDetails:
          type: array
          items:
            type: string
    InitResponse:
      type: object
      required: [configPath, configContent, summary]
      properties:
        configPath:
          type: string
        configContent:
          type: string
        usedShadcnDefaults:
          type: boolean
        shadcn:
          $ref: '#/components/schemas/ShadcnSnapshot'
        summary:
          $ref: '#/components/schemas/InitSummary'
    ResolveConfigRequest:
      type: object
      required: [cwd]
      properties:
        cwd:
          type: string
    ResolveConfigResponse:
      type: object
      required: [resolvedPath, source]
      properties:
        resolvedPath:
          type: string
        source:
          type: string
          enum: [component-config.ts, z2f.config.ts, none]
        contract:
          $ref: '#/components/schemas/ComponentConfigContract'
    ValidationResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - CONFIG_EXISTS
            - INVALID_SHADCN_CONFIG
            - INVALID_COMPONENT_CONFIG
            - INVALID_IMPORT_PATH_POLICY
        message:
          type: string
        details:
          type: object
          additionalProperties: true
