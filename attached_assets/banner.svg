<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D8D"/>
      <stop offset="100%" stop-color="#E11D8E"/>
    </linearGradient>
    <filter id="formShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="#FDFDFD"/>

  <!--
    Logo icon: Zod polygon scaled from viewBox 0 0 1309 1075 → 100×82 px
    Scale: sx = 100/1309 ≈ 0.07639, sy = 82/1075 ≈ 0.07628
    Translated so the logo is centered vertically in the 200 px banner
    and leaves 25 px left margin.
    Horizontal block (logo + gap + title): ≈ 100 + 24 + 350 = 474 px → left edge at (900-474)/2 = 213
  -->
  <g transform="translate(213,59)">
    <!-- Zod polygon background (pink gradient) -->
    <g transform="scale(0.07639,0.07628)">
      <path d="M258.188,0.987c-51.217,0 -96.967,32.03 -114.488,80.159l-132.717,364.517c-17.279,47.47 -3.479,100.679 34.7,133.762l536.4,464.825c46.192,40.029 114.892,39.638 160.625,-0.912l520.988,-461.934c37.296,-33.071 50.687,-85.525 33.808,-132.425l-132.241,-367.412c-17.4,-48.346 -63.259,-80.58 -114.638,-80.58l-792.438,0.001Z" fill="url(#pinkGrad)"/>
    </g>

    <!-- White form card overlay — centre of logo is (50, 41), card is 60×36 -->
    <rect x="20" y="23" width="60" height="36" rx="7" fill="white" filter="url(#formShadow)"/>
    <!-- Form lines (slate-200) -->
    <rect x="25.5" y="29"  width="42" height="2.8" rx="1.4" fill="#E2E8F0"/>
    <rect x="25.5" y="38"  width="30" height="2.8" rx="1.4" fill="#E2E8F0"/>
    <!-- Bottom row: short label line + teal checkbox -->
    <rect x="25.5" y="47"  width="18" height="2.8" rx="1.4" fill="#E2E8F0"/>
    <rect x="57"   y="43.5" width="17" height="13" rx="3"   fill="#14B8A6"/>
    <!-- Check mark -->
    <path d="M60 50 L63 53.5 L70 46" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title "zod-to-form" — baseline vertically centred with the logo -->
  <text
    x="337"
    y="100"
    dominant-baseline="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="-0.5"
    fill="#0F172A"
  >zod-to-form</text>

  <!-- Tagline — centred below the logo+title row -->
  <text
    x="450"
    y="158"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-size="17"
    font-weight="500"
  >
    <tspan fill="#64748B">Schema </tspan><tspan fill="#94A3B8">→ </tspan><tspan fill="#64748B">Form </tspan><tspan fill="#94A3B8">• </tspan><tspan fill="#14B8A6">React Hook Form</tspan><tspan fill="#94A3B8"> + </tspan><tspan fill="#EC4899">Zod</tspan>
  </text>
</svg>
