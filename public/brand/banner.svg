<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Logo Gradient -->
    <linearGradient id="logoPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D8D" />
      <stop offset="100%" stop-color="#E11D8E" />
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background (Pure White matching the React page) -->
  <rect width="1280" height="640" fill="#FDFDFD" />

  <!-- Center Content Container -->
  <g transform="translate(640, 260)">
    
    <!-- Header Logo + Title Group -->
    <g transform="translate(-400, -80)">
      <!-- Zod Gem Symbol -->
      <g transform="scale(0.18)">
        <path d="M258.188,0.987c-51.217,0 -96.967,32.03 -114.488,80.159l-132.717,364.517c-17.279,47.47 -3.479,100.679 34.7,133.762l536.4,464.825c46.192,40.029 114.892,39.638 160.625,-0.912l520.988,-461.934c37.296,-33.071 50.687,-85.525 33.808,-132.425l-132.241,-367.412c-17.4,-48.346 -63.259,-80.58 -114.638,-80.58l-792.438,0.001Z" fill="url(#logoPink)" />
        
        <g filter="url(#shadow)">
          <rect x="261.8" y="268.75" width="785.4" height="473" rx="104.72" fill="white" />
          <rect x="301.07" y="308.02" width="667.59" height="37.625" rx="18.81" fill="#E2E8F0" />
          <rect x="301.07" y="387.44" width="471.24" height="37.625" rx="18.81" fill="#E2E8F0" />
          <rect x="301.07" y="649.15" width="274.89" height="37.625" rx="18.81" fill="#E2E8F0" />
          <rect x="772.31" y="466.86" width="235.62" height="235.62" rx="45.81" fill="#14B8A6" />
          <svg x="811.58" y="506.13" width="157.08" height="157.08" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </g>
      </g>

      <!-- Main Text -->
      <text x="280" y="140" font-family="'Outfit', sans-serif, system-ui" font-weight="700" font-size="120" fill="#0F172A" letter-spacing="-3">zod-to-form</text>
    </g>

    <!-- Subtitle text exactly like the React page -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" font-family="'Outfit', sans-serif, system-ui" font-weight="500" font-size="42" text-anchor="middle">
        <tspan fill="#475569">Schema </tspan>
        <tspan fill="#94A3B8"> → </tspan>
        <tspan fill="#475569"> Form </tspan>
        <tspan fill="#94A3B8"> • </tspan>
        <tspan fill="#14B8A6"> React Hook Form</tspan>
        <tspan fill="#475569"> + </tspan>
        <tspan fill="#FF4D8D">Zod</tspan>
      </text>
    </g>

    <!-- Badges Row -->
    <g transform="translate(-250, 220)">
      <!-- Type-Safe Badge -->
      <g transform="translate(0, 0)">
        <rect width="160" height="48" rx="24" fill="white" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
        <svg x="24" y="14" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
        <text x="56" y="32" font-family="'Outfit', sans-serif, system-ui" font-weight="500" font-size="20" fill="#334155">Type-Safe</text>
      </g>

      <!-- Auto Forms Badge -->
      <g transform="translate(180, 0)">
        <rect width="170" height="48" rx="24" fill="white" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
        <svg x="20" y="14" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 14 4-4"/>
          <path d="M3.34 19a10 10 0 1 1 17.32 0"/>
        </svg>
        <text x="52" y="32" font-family="'Outfit', sans-serif, system-ui" font-weight="500" font-size="20" fill="#334155">Auto Forms</text>
      </g>

      <!-- React Badge -->
      <g transform="translate(370, 0)">
        <rect width="120" height="48" rx="24" fill="white" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)" />
        <svg x="20" y="14" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
          <path d="M2 12h20"/>
        </svg>
        <text x="52" y="32" font-family="'Outfit', sans-serif, system-ui" font-weight="500" font-size="20" fill="#334155">React</text>
      </g>
    </g>

  </g>
</svg>