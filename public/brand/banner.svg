<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    
    <!-- Accent Glows -->
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D8D" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FF4D8D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradient -->
    <linearGradient id="logoPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D8D" />
      <stop offset="100%" stop-color="#E11D8E" />
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#FF4D8D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <circle cx="200" cy="500" r="600" fill="url(#pinkGlow)" />
  <circle cx="1080" cy="140" r="600" fill="url(#tealGlow)" />

  <!-- Logo Group -->
  <g transform="translate(180, 200)">
    <!-- Gem Symbol -->
    <g transform="scale(0.18)" filter="url(#glow)">
      <path d="M258.188,0.987c-51.217,0 -96.967,32.03 -114.488,80.159l-132.717,364.517c-17.279,47.47 -3.479,100.679 34.7,133.762l536.4,464.825c46.192,40.029 114.892,39.638 160.625,-0.912l520.988,-461.934c37.296,-33.071 50.687,-85.525 33.808,-132.425l-132.241,-367.412c-17.4,-48.346 -63.259,-80.58 -114.638,-80.58l-792.438,0.001Z" fill="url(#logoPink)" />
      
      <g filter="url(#shadow)">
        <rect x="261.8" y="268.75" width="785.4" height="473" rx="104.72" fill="white" />
        <rect x="301.07" y="308.02" width="667.59" height="37.625" rx="18.81" fill="#E2E8F0" />
        <rect x="301.07" y="387.44" width="471.24" height="37.625" rx="18.81" fill="#E2E8F0" />
        <rect x="301.07" y="649.15" width="274.89" height="37.625" rx="18.81" fill="#E2E8F0" />
        <rect x="772.31" y="466.86" width="235.62" height="235.62" rx="45.81" fill="#14B8A6" />
        <svg x="811.58" y="506.13" width="157.08" height="157.08" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </g>
    </g>

    <!-- Main Text -->
    <text x="300" y="140" font-family="'Outfit', sans-serif, system-ui" font-weight="700" font-size="110" fill="#FFFFFF" letter-spacing="-2">zod-to-form</text>
    
    <!-- Subtitle -->
    <text x="308" y="195" font-family="'Outfit', sans-serif, system-ui" font-weight="500" font-size="32" fill="#94A3B8">
      Generate Forms from Zod Schemas
    </text>
  </g>

  <!-- Tags/Badges Group -->
  <g transform="translate(488, 480)">
    <!-- Zod Badge -->
    <g transform="translate(0, 0)">
      <rect width="120" height="44" rx="22" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
      <circle cx="28" cy="22" r="12" fill="#FF4D8D" />
      <text x="28" y="27" font-family="'Outfit', sans-serif, system-ui" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle">Z</text>
      <text x="50" y="28" font-family="'Outfit', sans-serif, system-ui" font-weight="600" font-size="16" fill="#F1F5F9">Zod</text>
    </g>

    <!-- React Badge -->
    <g transform="translate(136, 0)">
      <rect width="210" height="44" rx="22" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
      <svg x="16" y="10" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
        <path d="M2 12h20"/>
      </svg>
      <text x="48" y="28" font-family="'Outfit', sans-serif, system-ui" font-weight="600" font-size="16" fill="#F1F5F9">React Hook Form</text>
    </g>

    <!-- TypeScript Badge -->
    <g transform="translate(362, 0)">
      <rect width="160" height="44" rx="22" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
      <rect x="18" y="12" width="20" height="20" rx="4" fill="#3178C6" />
      <text x="28" y="26" font-family="'Outfit', sans-serif, system-ui" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">TS</text>
      <text x="48" y="28" font-family="'Outfit', sans-serif, system-ui" font-weight="600" font-size="16" fill="#F1F5F9">TypeScript</text>
    </g>
  </g>

  <!-- Illustration on right (Code to Form UI) -->
  <g transform="translate(1050, 320)" filter="url(#shadow)">
    <!-- Floating Form Card -->
    <g transform="rotate(4)">
      <rect x="-160" y="-80" width="320" height="200" rx="24" fill="#FFFFFF" />
      <!-- Form lines -->
      <rect x="-120" y="-40" width="160" height="12" rx="6" fill="#E2E8F0" />
      <rect x="-120" y="-12" width="200" height="12" rx="6" fill="#E2E8F0" />
      <rect x="-120" y="16" width="120" height="12" rx="6" fill="#E2E8F0" />
      <!-- Submit Button -->
      <rect x="-120" y="50" width="100" height="40" rx="8" fill="#14B8A6" />
      <text x="-70" y="75" font-family="'Outfit', sans-serif, system-ui" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">Submit</text>
    </g>
    
    <!-- Code Snippet Card -->
    <g transform="translate(-320, -60)">
      <rect x="-180" y="-40" width="280" height="80" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
      <text x="-140" y="7" font-family="'JetBrains Mono', monospace, system-ui" font-weight="500" font-size="20" fill="#E2E8F0">
        z.object({"{...}"})
      </text>
      <!-- Arrow -->
      <svg x="120" y="-16" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#14B8A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" stroke-opacity="0.3" />
        <path d="M8 12h8" />
        <path d="M12 8l4 4-4 4" />
      </svg>
    </g>
  </g>
</svg>